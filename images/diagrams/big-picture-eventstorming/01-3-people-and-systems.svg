<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100">
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#999"/></marker><style>.title{font:700 30px Arial,sans-serif;fill:#222}.label{font:700 19px Arial,sans-serif;fill:#222}.body{font:16px Arial,sans-serif;fill:#555}.note{font:14px Arial,sans-serif;fill:#222}.tiny{font:13px Arial,sans-serif;fill:#666}.actor{fill:#ffe29b}.system{fill:#f39bc9}.event{fill:#ffd7aa}</style></defs>
  <rect width="1800" height="1100" fill="#fff"/><rect x="20" y="20" width="1760" height="1060" fill="none" stroke="#cfcfcf"/>
  <rect x="40" y="38" width="470" height="36" rx="5" fill="#bfe1f5" stroke="#6faed5"/><text x="54" y="63" class="label">01.3 · People &amp; External Systems</text>
  <text x="45" y="125" class="title">Etapa 3 · People &amp; External Systems</text><text x="45" y="158" class="body">Actores y sistemas de apoyo asociados a los eventos del dominio; no se agregan eventos nuevos.</text>
  <text x="45" y="220" class="label">People / Actors</text><line x1="45" y1="240" x2="1755" y2="240" stroke="#ffbf3f" stroke-width="4"/>
  <g><rect x="70" y="275" width="270" height="110" class="actor"/><text x="90" y="315" class="note"><tspan x="90">Cattle Rancher /</tspan><tspan x="90" dy="20">Ganadero propietario</tspan><tspan x="90" dy="20">Decide sobre el hato</tspan></text><rect x="430" y="275" width="270" height="110" class="actor"/><text x="450" y="315" class="note"><tspan x="450">Farm Administrator /</tspan><tspan x="450" dy="20">Administrador</tspan><tspan x="450" dy="20">Coordina la operación</tspan></text><rect x="790" y="275" width="270" height="110" class="actor"/><text x="810" y="315" class="note"><tspan x="810">Veterinarian /</tspan><tspan x="810" dy="20">Zootechnician</tspan><tspan x="810" dy="20">Examina y trata</tspan></text><rect x="1150" y="275" width="270" height="110" class="actor"/><text x="1170" y="315" class="note"><tspan x="1170">Field personnel</tspan><tspan x="1170" dy="20">Registra observaciones</tspan><tspan x="1170" dy="20">durante la faena</tspan></text></g>
  <text x="45" y="470" class="label">Supporting systems in the domain flow</text><line x1="45" y1="490" x2="1755" y2="490" stroke="#e878b2" stroke-width="4"/>
  <g><rect x="120" y="525" width="300" height="100" class="system"/><text x="145" y="565" class="note"><tspan x="145">Smart Collar</tspan><tspan x="145" dy="20">Emite telemetría</tspan></text><rect x="570" y="525" width="300" height="100" class="system"/><text x="595" y="565" class="note"><tspan x="595">Edge Storage</tspan><tspan x="595" dy="20">Conserva lecturas sin cobertura</tspan></text><rect x="1020" y="525" width="300" height="100" class="system"/><text x="1045" y="565" class="note"><tspan x="1045">Central Service</tspan><tspan x="1045" dy="20">Recibe lecturas sincronizadas</tspan></text></g>
  <text x="45" y="715" class="label">Associated Domain Events</text>
  <g><rect x="45" y="755" width="240" height="95" class="event"/><text x="62" y="795" class="note"><tspan x="62">Animal registrado</tspan><tspan x="62" dy="20">en el hato</tspan></text><rect x="325" y="755" width="240" height="95" class="event"/><text x="342" y="795" class="note"><tspan x="342">Collar vinculado</tspan><tspan x="342" dy="20">al animal</tspan></text><rect x="605" y="755" width="240" height="95" class="event"/><text x="622" y="795" class="note"><tspan x="622">Lectura biométrica</tspan><tspan x="622" dy="20">capturada</tspan></text><rect x="885" y="755" width="240" height="95" class="event"/><text x="902" y="795" class="note"><tspan x="902">Diagnóstico</tspan><tspan x="902" dy="20">registrado</tspan></text><rect x="1165" y="755" width="240" height="95" class="event"/><text x="1182" y="795" class="note"><tspan x="1182">Tratamiento</tspan><tspan x="1182" dy="20">aplicado</tspan></text><rect x="1445" y="755" width="240" height="95" class="event"/><text x="1462" y="795" class="note"><tspan x="1462">Reporte entregado</tspan><tspan x="1462" dy="20">al propietario</tspan></text></g>
  <g stroke="#999" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M205 385v350M565 385v350M925 385v350M1285 385v350M270 625l-80 120M720 625l-80 120M1170 625l-80 120M1170 625l200 120"/></g>
  <text x="45" y="990" class="tiny">Los actores provienen del glosario y los sistemas de apoyo se limitan al collar, almacenamiento de borde y servicio central mencionados en la línea de eventos.</text>
</svg>
