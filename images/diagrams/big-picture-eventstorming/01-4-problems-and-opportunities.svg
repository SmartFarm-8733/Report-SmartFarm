<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1450" viewBox="0 0 1900 1450">
  <style>.title{font:700 30px Arial,sans-serif;fill:#222}.label{font:700 17px Arial,sans-serif;fill:#222}.note{font:14px Arial,sans-serif;fill:#222}.tiny{font:13px Arial,sans-serif;fill:#666}.anchor{fill:#ffd7aa}.hot{fill:#ffb3a6}.opp{fill:#a9e7b3}.assume{fill:#ffe39a}</style>
  <rect width="1900" height="1450" fill="#fff"/><rect x="20" y="20" width="1860" height="1410" fill="none" stroke="#cfcfcf"/>
  <rect x="40" y="38" width="520" height="36" rx="5" fill="#f8c8a7" stroke="#e59a6a"/><text x="54" y="63" class="label">01.4 · Problems &amp; Opportunities</text>
  <text x="45" y="125" class="title">Etapa 4 · Problems &amp; Opportunities</text><text x="45" y="158" class="tiny">Hot spots y oportunidades anclados a eventos del dominio; las notas amarillas quedan como supuestos por validar.</text>
  <text x="45" y="225" class="label">EVENT ANCHOR</text><text x="335" y="225" class="label">HOTSPOT / PROBLEM</text><text x="775" y="225" class="label">OPPORTUNITY</text><text x="1215" y="225" class="label">ASSUMPTION TO VALIDATE</text>
  <g stroke="#999" stroke-width="2" fill="none" marker-end="url(#arrow)"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#999"/></marker></defs><path d="M285 330h35M725 330h35M1165 330h35M285 570h35M725 570h35M1165 570h35M285 810h35M725 810h35M1165 810h35M285 1050h35M725 1050h35M1165 1050h35M285 1290h35M725 1290h35M1165 1290h35"/></g>
  <g>
    <rect x="45" y="265" width="240" height="130" class="anchor"/><text x="62" y="310" class="note"><tspan x="62">Umbral de temperatura</tspan><tspan x="62" dy="21">superado</tspan></text><rect x="325" y="265" width="400" height="130" class="hot"/><text x="345" y="300" class="note"><tspan x="345">THRESHOLDS BY</tspan><tspan x="345" dy="20">PRODUCTION STAGE</tspan><tspan x="345" dy="20">La regla depende de edad, raza y etapa.</tspan></text><rect x="765" y="265" width="400" height="130" class="opp"/><text x="785" y="300" class="note"><tspan x="785">Configurar monitoreo</tspan><tspan x="785" dy="20">continuo con umbrales</tspan><tspan x="785" dy="20">adaptables.</tspan></text><rect x="1205" y="265" width="400" height="130" class="assume"/><text x="1225" y="300" class="note"><tspan x="1225">Validar con veterinarios</tspan><tspan x="1225" dy="20">los valores por defecto.</tspan></text>
    <rect x="45" y="505" width="240" height="130" class="anchor"/><text x="62" y="550" class="note"><tspan x="62">Animal fuera de</tspan><tspan x="62" dy="21">la zona de pastoreo</tspan></text><rect x="325" y="505" width="400" height="130" class="hot"/><text x="345" y="540" class="note"><tspan x="345">LOCATION ACCURACY</tspan><tspan x="345" dy="20">La posición puede generar</tspan><tspan x="345" dy="20">falsas salidas de zona.</tspan></text><rect x="765" y="505" width="400" height="130" class="opp"/><text x="785" y="540" class="note"><tspan x="785">Usar última posición</tspan><tspan x="785" dy="20">con tolerancia configurable</tspan><tspan x="785" dy="20">y alertas.</tspan></text><rect x="1205" y="505" width="400" height="130" class="assume"/><text x="1225" y="540" class="note"><tspan x="1225">Validar precisión</tspan><tspan x="1225" dy="20">en condiciones de campo.</tspan></text>
    <rect x="45" y="745" width="240" height="130" class="anchor"/><text x="62" y="790" class="note"><tspan x="62">Alerta emitida</tspan><tspan x="62" dy="21">al responsable</tspan></text><rect x="325" y="745" width="400" height="130" class="hot"/><text x="345" y="780" class="note"><tspan x="345">BREED REGISTRY</tspan><tspan x="345" dy="20">La validación depende de</tspan><tspan x="345" dy="20">un procedimiento externo.</tspan></text><rect x="765" y="745" width="400" height="130" class="opp"/><text x="785" y="780" class="note"><tspan x="785">Entregar alertas</tspan><tspan x="785" dy="20">accionables y registrar</tspan><tspan x="785" dy="20">su atención.</tspan></text><rect x="1205" y="745" width="400" height="130" class="assume"/><text x="1225" y="780" class="note"><tspan x="1225">Verificar el procedimiento</tspan><tspan x="1225" dy="20">vigente antes de integrar.</tspan></text>
    <rect x="45" y="985" width="240" height="130" class="anchor"/><text x="62" y="1030" class="note"><tspan x="62">Tratamiento</tspan><tspan x="62" dy="21">aplicado</tspan></text><rect x="325" y="985" width="400" height="130" class="hot"/><text x="345" y="1020" class="note"><tspan x="345">FIELD RECORD AUTHORSHIP</tspan><tspan x="345" dy="20">No está claro quién puede</tspan><tspan x="345" dy="20">registrar un diagnóstico.</tspan></text><rect x="765" y="985" width="400" height="130" class="opp"/><text x="785" y="1020" class="note"><tspan x="785">Centralizar historia clínica,</tspan><tspan x="785" dy="20">tratamiento y periodo</tspan><tspan x="785" dy="20">de retiro.</tspan></text><rect x="1205" y="985" width="400" height="130" class="assume"/><text x="1225" y="1020" class="note"><tspan x="1225">Confirmar roles para</tspan><tspan x="1225" dy="20">observación y diagnóstico.</tspan></text>
    <rect x="45" y="1225" width="240" height="130" class="anchor"/><text x="62" y="1270" class="note"><tspan x="62">Lectura sincronizada</tspan><tspan x="62" dy="21">con el servicio central</tspan></text><rect x="325" y="1225" width="400" height="130" class="hot"/><text x="345" y="1260" class="note"><tspan x="345">OFFLINE RECONCILIATION</tspan><tspan x="345" dy="20">Puede existir conflicto si</tspan><tspan x="345" dy="20">el animal fue dado de baja.</tspan></text><rect x="765" y="1225" width="400" height="130" class="opp"/><text x="785" y="1260" class="note"><tspan x="785">Conservar conflictos</tspan><tspan x="785" dy="20">para revisión después</tspan><tspan x="785" dy="20">de recuperar cobertura.</tspan></text><rect x="1205" y="1225" width="400" height="130" class="assume"/><text x="1225" y="1260" class="note"><tspan x="1225">Definir la regla para</tspan><tspan x="1225" dy="20">la baja durante offline.</tspan></text>
  </g>
  <text x="45" y="1405" class="tiny">Las incertidumbres se mantienen visibles para orientar la validación con usuarios y el diseño posterior.</text>
</svg>
