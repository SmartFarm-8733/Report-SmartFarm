<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">Sistema visual inicial de ICHU</title>
  <desc id="desc">Tablero de referencia con los colores, tipografías, escala de espaciado y estados de interfaz definidos para ICHU.</desc>
  <rect width="1600" height="920" fill="#F6F5F0"/>
  <rect x="48" y="44" width="1504" height="832" rx="8" fill="#FFFFFF" stroke="#E1DED4" stroke-width="2"/>

  <text x="92" y="116" fill="#22362A" font-family="Outfit, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3">SMARTFARM / DESIGN SYSTEM</text>
  <text x="92" y="194" fill="#27271F" font-family="Outfit, Arial, sans-serif" font-size="64" font-weight="600">ICHU</text>
  <text x="292" y="190" fill="#6F6E60" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="24">Una interfaz clara para el trabajo ganadero</text>
  <line x1="92" y1="232" x2="1508" y2="232" stroke="#E1DED4" stroke-width="2"/>

  <text x="92" y="292" fill="#27271F" font-family="Outfit, Arial, sans-serif" font-size="30" font-weight="600">01 / Paleta</text>
  <text x="92" y="328" fill="#6F6E60" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="18">Tonos de suelo y vegetación; estados siempre acompañados por texto.</text>

  <g font-family="Plus Jakarta Sans, Arial, sans-serif">
    <rect x="92" y="362" width="278" height="112" rx="5" fill="#F6F5F0" stroke="#E1DED4"/>
    <text x="112" y="416" fill="#27271F" font-size="18" font-weight="600">Fondo cálido</text><text x="112" y="450" fill="#6F6E60" font-size="17">#F6F5F0</text>
    <rect x="386" y="362" width="278" height="112" rx="5" fill="#22362A"/>
    <text x="406" y="416" fill="#FFFFFF" font-size="18" font-weight="600">Verde bosque</text><text x="406" y="450" fill="#E8E5D8" font-size="17">#22362A</text>
    <rect x="680" y="362" width="278" height="112" rx="5" fill="#33513E"/>
    <text x="700" y="416" fill="#FFFFFF" font-size="18" font-weight="600">Verde principal</text><text x="700" y="450" fill="#E8E5D8" font-size="17">#33513E</text>
    <rect x="974" y="362" width="248" height="112" rx="5" fill="#A5813A"/>
    <text x="994" y="416" fill="#FFFFFF" font-size="18" font-weight="600">Ocre</text><text x="994" y="450" fill="#FFFFFF" font-size="17">#A5813A</text>
    <rect x="1238" y="362" width="270" height="112" rx="5" fill="#E4B842"/>
    <text x="1258" y="416" fill="#143527" font-size="18" font-weight="600">Dorado</text><text x="1258" y="450" fill="#143527" font-size="17">#E4B842</text>
  </g>

  <text x="92" y="542" fill="#27271F" font-family="Outfit, Arial, sans-serif" font-size="30" font-weight="600">02 / Tipografía y jerarquía</text>
  <text x="92" y="598" fill="#22362A" font-family="Outfit, Arial, sans-serif" font-size="38" font-weight="600">Outfit · títulos y encabezados</text>
  <text x="92" y="638" fill="#6F6E60" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="18">Pesos 600–700 · distinguir página, sección y tarjeta</text>
  <text x="92" y="700" fill="#27271F" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="27" font-weight="500">Plus Jakarta Sans · lectura y controles</text>
  <text x="92" y="738" fill="#6F6E60" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="18">Pesos 400–700 · texto claro, breve y consistente</text>

  <rect x="920" y="530" width="588" height="244" rx="6" fill="#F6F5F0" stroke="#E1DED4"/>
  <text x="960" y="582" fill="#27271F" font-family="Outfit, Arial, sans-serif" font-size="25" font-weight="600">03 / Estados de interfaz</text>
  <g font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="18" font-weight="600">
    <rect x="960" y="614" width="145" height="42" rx="4" fill="#EBF1EA" stroke="#4C7A57"/><circle cx="980" cy="635" r="6" fill="#4C7A57"/><text x="996" y="641" fill="#33513E">Correcto</text>
    <rect x="1120" y="614" width="162" height="42" rx="4" fill="#F5EFDD" stroke="#96742C"/><path d="M1141 628l7 13h-14z" fill="#96742C"/><text x="1157" y="641" fill="#6F5720">Atención</text>
    <rect x="1296" y="614" width="172" height="42" rx="4" fill="#F6E9E6" stroke="#A4463C"/><path d="M1317 628l13 13m0-13l-13 13" stroke="#A4463C" stroke-width="3"/><text x="1340" y="641" fill="#853A33">Alerta</text>
  </g>
  <text x="960" y="710" fill="#6F6E60" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="17">Color + etiqueta + señal visual; no depender solo del color.</text>

  <line x1="92" y1="814" x2="1508" y2="814" stroke="#E1DED4" stroke-width="2"/>
  <text x="92" y="852" fill="#6F6E60" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="16">Espaciado base: 4 · 8 · 12 · 16 · 24 · 32 px</text>
  <text x="1508" y="852" text-anchor="end" fill="#6F6E60" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="16">Muestra inicial · validar contraste y tamaños en cada pantalla</text>
</svg>
